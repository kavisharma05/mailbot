# External pinger: wakes a sleeping Render free instance.
# The in-app self-ping cannot do this — that process is gone while the dyno sleeps.
# GitHub cron can drift a few minutes; 5-minute hits still beat Render's ~15 min idle sleep.
name: Keep Render awake
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /ping
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_URL:-}" ]; then
            echo "::error::Set repo secret RENDER_URL to https://your-service.onrender.com"
            exit 1
          fi
          BASE="${RENDER_URL%/}"
          curl -fsS --retry 4 --retry-all-errors --retry-delay 8 --max-time 45 "${BASE}/ping"
          echo "awake ${BASE}"
