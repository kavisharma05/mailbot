name: Mailbot Scheduler
on:
  schedule:
    - cron: '*/5 * * * *'    # watch-gmail — every 5 min (cold-start safety net)
    - cron: '30 1 * * *'     # morning digest — 07:00 IST
    - cron: '30 14 * * *'    # evening digest — 20:00 IST (8pm)
  workflow_dispatch:

jobs:
  watch:
    if: github.event.schedule == '*/5 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: mailbot
    steps:
      - name: Watch Gmail
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
          TASK_SECRET: ${{ secrets.TASK_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_URL:-}" ]; then
            echo "::error::GitHub secret RENDER_URL is missing or empty. Set it to your Render URL (e.g. https://mailbot-xxxx.onrender.com) under Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -z "${TASK_SECRET:-}" ]; then
            echo "::error::GitHub secret TASK_SECRET is missing or empty. Set it to the same value as Render's TASK_SECRET."
            exit 1
          fi
          BASE="${RENDER_URL%/}"
          curl -fsS -X POST "${BASE}/tasks/watch-gmail" \
            -H "x-task-secret: ${TASK_SECRET}"

      - name: Heartbeat ping (optional)
        if: env.HEARTBEAT_URL != ''
        env:
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
        run: |
          curl -fsS "${HEARTBEAT_URL}"

  morning_digest:
    if: github.event.schedule == '30 1 * * *'
    runs-on: ubuntu-latest
    environment: mailbot
    steps:
      - name: Morning digest
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
          TASK_SECRET: ${{ secrets.TASK_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_URL:-}" ]; then
            echo "::error::GitHub secret RENDER_URL is missing or empty."
            exit 1
          fi
          if [ -z "${TASK_SECRET:-}" ]; then
            echo "::error::GitHub secret TASK_SECRET is missing or empty."
            exit 1
          fi
          BASE="${RENDER_URL%/}"
          curl -fsS -X POST "${BASE}/tasks/digest-morning" \
            -H "x-task-secret: ${TASK_SECRET}"

  evening_digest:
    if: github.event.schedule == '30 14 * * *'
    runs-on: ubuntu-latest
    environment: mailbot
    steps:
      - name: Evening digest
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
          TASK_SECRET: ${{ secrets.TASK_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_URL:-}" ]; then
            echo "::error::GitHub secret RENDER_URL is missing or empty."
            exit 1
          fi
          if [ -z "${TASK_SECRET:-}" ]; then
            echo "::error::GitHub secret TASK_SECRET is missing or empty."
            exit 1
          fi
          BASE="${RENDER_URL%/}"
          curl -fsS -X POST "${BASE}/tasks/digest-evening" \
            -H "x-task-secret: ${TASK_SECRET}"
