name: Mailbot Scheduler
on:
  schedule:
    - cron: '*/5 * * * *'    # watch-gmail — every 5 min (cold-start safety net)
    - cron: '30 1 * * *'     # morning digest — 07:00 IST
    - cron: '30 14 * * *'    # evening digest — 20:00 IST (8pm)
  workflow_dispatch:

jobs:
  watch:
    if: github.event.schedule == '*/5 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Watch Gmail
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
          TASK_SECRET: ${{ secrets.TASK_SECRET }}
        run: |
          curl -fsS -X POST "${RENDER_URL}/tasks/watch-gmail" \
            -H "x-task-secret: ${TASK_SECRET}"

  morning_digest:
    if: github.event.schedule == '30 1 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Morning digest
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
          TASK_SECRET: ${{ secrets.TASK_SECRET }}
        run: |
          curl -fsS -X POST "${RENDER_URL}/tasks/digest-morning" \
            -H "x-task-secret: ${TASK_SECRET}"

  evening_digest:
    if: github.event.schedule == '30 14 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Evening digest
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
          TASK_SECRET: ${{ secrets.TASK_SECRET }}
        run: |
          curl -fsS -X POST "${RENDER_URL}/tasks/digest-evening" \
            -H "x-task-secret: ${TASK_SECRET}"
